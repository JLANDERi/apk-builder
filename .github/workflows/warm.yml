name: Warm cache

# Builds a sample app on main and saves the downloaded libraries, so real builds start with a ready cache.
# Runs automatically when this repo changes and once a week.
on:
  push:
    branches: [main]
    paths:
      - "tools/**"
      - "warm/**"
      - ".github/workflows/warm.yml"
  schedule:
    - cron: "17 3 * * 0"
  workflow_dispatch:

concurrency:
  group: warm-cache
  cancel-in-progress: true

jobs:
  warm:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
          cache-disabled: true

      - name: Generate sample project (all libraries on)
        run: node tools/generate.js warm/config.json warm/icons.zip app-out

      - name: Build sample
        working-directory: app-out
        run: |
          keytool -genkeypair -keystore release.keystore -alias key0 -keyalg RSA -keysize 2048 -validity 10000 -storepass android123 -keypass android123 -dname "CN=Warm, O=JLANDER, C=PK"
          gradle assembleRelease --no-daemon --parallel --build-cache

      - name: Save Gradle cache
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-warm-${{ github.run_id }}
